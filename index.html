<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnichord - Minimal Ocean</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100%; 
  background: #020714; 
  color: #D4F2F9; 
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  overflow: hidden; 
  user-select: none;
  -webkit-user-select: none;
}
body { display: flex; flex-direction: column; height: 100vh; padding: 16px; gap: 16px; }

/* Clean Top Header Bar */
.header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.logo { font-weight: 700; font-size: 18px; letter-spacing: -0.03em; color: #8EDFF6; text-transform: lowercase; }

/* Simplified Pure Metronome Control */
.controls { display: flex; align-items: center; gap: 12px; }
.rhythm-toggle {
  background: #002244; border: 1px solid #003366; color: #8EDFF6;
  font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all .15s ease;
}
.rhythm-toggle:hover { background: #003366; color: #D4F2F9; }
.rhythm-toggle.on { background: #00B9E8; border-color: #00B9E8; color: #020714; }

.tempo-display {
  font-size: 14px; font-weight: 700; color: #D4F2F9; background: #000B58;
  border: 1px solid #002244; padding: 5px 10px; min-width: 42px; text-align: center; border-radius: 6px;
}
.nudge {
  width: 28px; height: 28px; background: #002244; border: 1px solid #003366; color: #8EDFF6;
  font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.nudge:hover { background: #003366; }
#tempo-slider { width: 90px; accent-color: #00B9E8; cursor: pointer; height: 4px; }

/* Visual Flash dot for Metronome Beats */
.beat-dots { display: flex; gap: 6px; align-items: center; }
.beat-dot { width: 8px; height: 8px; border-radius: 50%; background: #001533; transition: background 0.05s; }
.beat-dot.on { background: #00B9E8; box-shadow: 0 0 10px #00B9E8; }

/* Main Screen Workspace split in two */
.main-layout { display: flex; flex: 1; gap: 16px; overflow: hidden; }

/* Chord Section (Left side) */
.chord-workspace { display: flex; flex: 1; gap: 8px; overflow: hidden; }
.labels-sidebar { display: flex; flex-direction: column; gap: 4px; justify-content: stretch; width: 44px; }
.row-label {
  flex: 1; display: flex; align-items: center; justify-content: flex-end;
  font-size: 11px; font-weight: 700; color: #0066C4; text-transform: uppercase; letter-spacing: 0.05em; padding-right: 4px;
}
.grid-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.chord-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; flex: 1; }

.chord-key {
  border: none; border-radius: 4px;
  font-family: inherit; font-size: 11px; font-weight: 600;
  color: rgba(255, 255, 255, 0.85); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .05s, filter .1s;
  -webkit-tap-highlight-color: transparent;
}
.chord-key:hover { filter: brightness(1.2); }
.chord-key:active { transform: scale(.96); }
.chord-key.selected { color: #020714; font-weight: 700; filter: brightness(1.35); box-shadow: inset 0 0 0 2px #D4F2F9; }

/* Giant Vertical Strum Plate (Right side Optimized) */
.strum-section { width: 140px; position: relative; display: flex; flex-shrink: 0; }
#strum-plate {
  width: 100%; height: 100%; border-radius: 8px;
  background: #000B58; border: 2px solid #002244;
  position: relative; overflow: hidden; cursor: crosshair; touch-action: none;
  display: flex; flex-direction: column; align-items: stretch;
}
.string-strip { flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.02); transition: background .15s; }
.string-strip:last-child { border-bottom: none; }

/* Chord Display Text centered on the vertical plate */
#chord-name {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg);
  font-size: 42px; font-weight: 800; color: rgba(142, 223, 246, 0.15); pointer-events: none; text-transform: uppercase;
  white-space: nowrap; letter-spacing: -0.02em;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">omnichord</div>
  <div class="controls">
    <button class="rhythm-toggle" id="metro-toggle">Metronome</button>
    <div class="beat-dots" id="beat-dots"><div class="beat-dot"></div></div>
    <button class="nudge" id="tempo-dn">−</button>
    <div class="tempo-display" id="tempo-display">90</div>
    <button class="nudge" id="tempo-up">+</button>
    <input type="range" id="tempo-slider" min="40" max="200" value="90" step="1">
  </div>
</div>

<div class="main-layout">
  <div class="chord-workspace">
    <div class="labels-sidebar" id="labels-sidebar"></div>
    <div class="grid-wrap" id="grid-wrap"></div>
  </div>
  
  <div class="strum-section">
    <div id="strum-plate">
      <div id="chord-name">—</div>
    </div>
  </div>
</div>

<script>
// Ocean-inspired colors matching your image asset
const NOTE_COLORS = [
  '#000B58', '#001E75', '#003394', '#004BB3', '#0066C4', '#0084D6',
  '#009FE3', '#00B9E8', '#3CCCEF', '#6EDFF3', '#8EDFF6', '#B2EDF7'
];

const ROOTS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BASE = {
  'C':130.81,'C#':138.59,'D':146.83,'D#':155.56,
  'E':164.81,'F':174.61,'F#':185.00,'G':196.00,
  'G#':207.65,'A':220.00,'A#':233.08,'B':246.94
};

const INTERVALS = {
  maj:  [0,4,7],    min:  [0,3,7],
  maj7: [0,4,7,11], min7: [0,3,7,10],
  dom7: [0,4,7,10], aug:  [0,4,8],
  dim:  [0,3,6],
};

function buildChord(root, type){
  const rootIdx = ROOTS.indexOf(root);
  const notes = [];
  INTERVALS[type].forEach(iv=>{
    const ni = (rootIdx+iv)%12;
    const oct = Math.floor((rootIdx+iv)/12);
    notes.push(BASE[ROOTS[ni]] * Math.pow(2, oct));
    notes.push(BASE[ROOTS[ni]] * Math.pow(2, oct+1));
  });
  notes.sort((a,b)=>a-b);
  const unique = [...new Set(notes.map(f=>Math.round(f*100)/100))];
  return unique.slice(0,7);
}

const ROWS = [
  { label: 'maj',  type: 'maj',  suffix: '' },
  { label: 'min',  type: 'min',  suffix: 'm' },
  { label: 'maj7', type: 'maj7', suffix: 'M7' },
  { label: 'min7', type: 'min7', suffix: 'm7' },
  { label: '7',    type: 'dom7', suffix: '7' },
  { label: 'aug',  type: 'aug',  suffix: '+' },
  { label: 'dim',  type: 'dim',  suffix: '°' },
];

const gridWrap = document.getElementById('grid-wrap');
const sidebar = document.getElementById('labels-sidebar');
let selectedBtn = null, selectedChord = null;

ROWS.forEach((row)=>{
  const labelEl = document.createElement('div');
  labelEl.className = 'row-label';
  labelEl.textContent = row.label;
  sidebar.appendChild(labelEl);

  const rowEl = document.createElement('div');
  rowEl.className = 'chord-row';

  ROOTS.forEach((root, ci)=>{
    const btn = document.createElement('button');
    btn.className = 'chord-key';
    const name = root + row.suffix;
    btn.textContent = name;
    btn.style.background = NOTE_COLORS[ci];
    if(ci > 7) btn.style.color = '#020714'; // Ensure legibility on light tints

    const chordFreqs = buildChord(root, row.type);
    btn.addEventListener('click', ()=>{ selectChord({name, freqs: chordFreqs, colorIdx: ci}, btn, true); });
    btn.addEventListener('touchstart', e=>{ e.preventDefault(); selectChord({name, freqs: chordFreqs, colorIdx: ci}, btn, true); }, {passive:false});
    rowEl.appendChild(btn);
  });
  gridWrap.appendChild(rowEl);
});

function selectChord(ch, btn, play){
  if(selectedBtn) selectedBtn.classList.remove('selected');
  btn.classList.add('selected');
  selectedBtn = btn;
  selectedChord = ch;
  
  const chordDisplay = document.getElementById('chord-name');
  chordDisplay.textContent = ch.name;
  chordDisplay.style.color = 'rgba(212, 242, 249, 0.7)'; 
  
  if(play) strumFull(ch.freqs, 0.025);
}

/* Vertical Strum Plate Generation */
const plate = document.getElementById('strum-plate');
const NUM_STRINGS = 24;
const strips = [];

for(let i=0; i<NUM_STRINGS; i++){
  const s = document.createElement('div');
  s.className = 'string-strip';
  plate.appendChild(s);
  strips.push(s);
}
plate.appendChild(document.getElementById('chord-name'));

let isStruming=false, lastStrumIdx=-1;

function strumAt(clientY){
  if(!selectedChord) return;
  const rect = plate.getBoundingClientRect();
  const frac = Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
  const idx = Math.min(NUM_STRINGS-1, Math.floor(frac*NUM_STRINGS));
  if(idx===lastStrumIdx) return;
  lastStrumIdx = idx;
  const freqs = selectedChord.freqs;
  const noteIdx = Math.min(freqs.length-1, Math.floor(frac*freqs.length));
  playNote(freqs[noteIdx], ensureCtx().currentTime, 2.0, 0.22);
  
  strips[idx].style.background = 'rgba(142, 223, 246, 0.25)';
  setTimeout(()=>{ if(strips[idx]) strips[idx].style.background=''; }, 150);
}

plate.addEventListener('mousedown', e=>{ isStruming=true;lastStrumIdx=-1;strumAt(e.clientY); });
plate.addEventListener('mousemove', e=>{ if(isStruming) strumAt(e.clientY); });
window.addEventListener('mouseup', ()=>{ isStruming=false;lastStrumIdx=-1; });
plate.addEventListener('touchstart', e=>{ e.preventDefault();isStruming=true;lastStrumIdx=-1;strumAt(e.touches[0].clientY); },{passive:false});
plate.addEventListener('touchmove', e=>{ e.preventDefault();strumAt(e.touches[0].clientY); },{passive:false});
plate.addEventListener('touchend', ()=>{ isStruming=false;lastStrumIdx=-1; });

function strumFull(freqs, spd){
  const c=ensureCtx(), t=c.currentTime;
  freqs.forEach((f,i)=>playNote(f, t+i*spd, 2.0, 0.18));
}

/* Audio Engine Architecture */
let ctx, masterGain, dryGain, reverbGain, convolver;

function buildReverb(c){
  const len=c.sampleRate*2.0, buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}
  const cv=c.createConvolver();cv.buffer=buf;return cv;
}

function ensureCtx(){
  if(!ctx){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=ctx.createGain();masterGain.gain.value=0.8;
    dryGain=ctx.createGain();dryGain.gain.value=0.7;
    reverbGain=ctx.createGain();reverbGain.gain.value=0.25;
    convolver=buildReverb(ctx);
    masterGain.connect(dryGain);dryGain.connect(ctx.destination);
    masterGain.connect(convolver);convolver.connect(reverbGain);reverbGain.connect(ctx.destination);
  }
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}

function playNote(freq, when, dur, vol=0.2){
  const c=ensureCtx();
  const bufLen=Math.ceil(c.sampleRate*0.05);
  const buf=c.createBuffer(1,bufLen,c.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<bufLen;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=buf;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=60;
  const g=c.createGain();g.gain.setValueAtTime(vol*1.6,when);g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  src.connect(bp);bp.connect(g);g.connect(masterGain);src.start(when);src.stop(when+dur+0.05);
  
  const o=c.createOscillator();const g2=c.createGain();
  o.type='sine';o.frequency.value=freq;
  g2.gain.setValueAtTime(0,when);g2.gain.linearRampToValueAtTime(vol*0.4,when+0.008);
  g2.gain.exponentialRampToValueAtTime(0.001,when+dur*1.2);
  o.connect(g2);g2.connect(masterGain);o.start(when);o.stop(when+dur*1.2+0.05);
}

/* Pure Minimalistic Metronome Mechanics */
let metroInterval=null, isMetroOn=false, metroTick=0;
const dot = document.querySelector('.beat-dot');

function playClick(when, isDownbeat) {
  const c = ensureCtx();
  const osc = c.createOscillator();
  const gainNode = c.createGain();
  
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(isDownbeat ? 880 : 440, when);
  
  gainNode.gain.setValueAtTime(0.4, when);
  gainNode.gain.exponentialRampToValueAtTime(0.001, when + 0.05);
  
  osc.connect(gainNode);
  gainNode.connect(c.destination);
  osc.start(when);
  osc.stop(when + 0.06);
}

function startMetronome() {
  stopMetronome();
  isMetroOn = true;
  document.getElementById('metro-toggle').classList.add('on');
  const bpm = +document.getElementById('tempo-slider').value;
  const intervalMs = (60 / bpm) * 1000;
  
  metroInterval = setInterval(() => {
    const isDownbeat = (metroTick === 0);
    playClick(ensureCtx().currentTime, isDownbeat);
    
    // Toggle flash animation indicator
    dot.classList.add('on');
    setTimeout(() => dot.classList.remove('on'), 60);
    
    metroTick = (metroTick + 1) % 4; // 4/4 Time base tracking
  }, intervalMs);
}

function stopMetronome() {
  clearInterval(metroInterval);
  isMetroOn = false;
  metroTick = 0;
  document.getElementById('metro-toggle').classList.remove('on');
}

document.getElementById('metro-toggle').addEventListener('click', () => {
  if (isMetroOn) stopMetronome(); else startMetronome();
});

let tempo = 90;
function setTempo(v){
  tempo = Math.max(40, Math.min(200, Math.round(v)));
  document.getElementById('tempo-display').textContent = tempo;
  document.getElementById('tempo-slider').value = tempo;
  if(isMetroOn) startMetronome();
}
document.getElementById('tempo-slider').addEventListener('input', e=>setTempo(+e.target.value));
document.getElementById('tempo-up').addEventListener('click', ()=>setTempo(tempo+5));
document.getElementById('tempo-dn').addEventListener('click', ()=>setTempo(tempo-5));

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); if(selectedChord) strumFull(selectedChord.freqs, 0.025); }
  if(e.code==='ArrowRight') setTempo(tempo+5);
  if(e.code==='ArrowLeft') setTempo(tempo-5);
});

// Auto-select basic C chord initialization setup
setTimeout(() => {
  const initialBtn = document.querySelector('.chord-key');
  if(initialBtn) initialBtn.click();
}, 400);
</script>
</body>
</html>
